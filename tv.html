<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>PULSE TV // LIVE TELEVISION</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07080C">

  <style>
    :root {
      --bg-primary: #07080C;
      --bg-card: rgba(18, 22, 31, 0.92);
      --accent-tv: #FF3366;
      --accent-cyan: #00F0FF;
      --text-main: #F0F6FC;
      --text-muted: #8B949E;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: var(--bg-primary);
      overflow: hidden;
      font-family: var(--font-ui);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Start TV Modal Gateway */
    .start-gate {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #1a0814 0%, #07080c 80%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand-mark svg {
      width: 42px;
      height: 42px;
      fill: var(--accent-tv);
    }

    .brand-mark h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .brand-mark h1 span {
      color: var(--accent-tv);
    }

    .start-btn {
      background: linear-gradient(135deg, var(--accent-tv), #FF6600);
      color: #FFFFFF;
      border: none;
      padding: 20px 48px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255, 51, 102, 0.55);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-transform: uppercase;
    }

    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 45px rgba(255, 51, 102, 0.85);
    }

    .start-btn:active {
      transform: scale(0.96);
    }

    /* Header Bar */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 8px 16px;
      background: rgba(7, 8, 12, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 10;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 51, 102, 0.15);
      border: 1px solid var(--accent-tv);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent-tv);
      letter-spacing: 1px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-tv);
      box-shadow: 0 0 8px var(--accent-tv);
      animation: tvPulse 1.5s infinite;
    }

    @keyframes tvPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .listeners-count {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent-cyan);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* TV Viewport Area */
    .tv-viewport-container {
      position: relative;
      flex: 1;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overflow: hidden;
    }

    .tv-video {
      max-width: 100vw;
      max-height: 100%;
      width: auto;
      height: auto;
      aspect-ratio: auto;
      object-fit: contain;
      background: #000000;
    }

    .tv-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
    }

    /* Transition Countdown Toast */
    .transition-toast {
      position: absolute;
      top: 18px;
      background: rgba(18, 22, 31, 0.9);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 8px 18px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 20;
      display: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    /* Bottom Control & Broadcast Metadata Deck */
    .tv-meta-deck {
      width: 100%;
      background: var(--bg-card);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)) 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10;
    }

    .broadcast-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .broadcast-title {
      font-size: clamp(0.9rem, 3.5vw, 1.15rem);
      font-weight: 800;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .broadcast-contributor {
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      color: var(--accent-tv);
      font-family: var(--font-mono);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .deck-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      min-height: 42px;
    }

    .ctrl-btn:hover {
      background: var(--accent-tv);
      border-color: var(--accent-tv);
      box-shadow: 0 0 14px rgba(255, 51, 102, 0.4);
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    .ctrl-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Initial User-Gesture Gate -->
  <div id="startGate" class="start-gate">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
      <h1>PULSE <span>TV</span></h1>
    </div>
    <button class="start-btn" onclick="startPulseTV()">📺 START TV</button>
  </div>

  <header>
    <div class="live-badge">
      <span class="live-dot"></span>
      <span id="headerStatus">LIVE ON AIR</span>
    </div>
    <div class="listeners-count" id="viewerReadout">VIEWERS: 1 LIVE</div>
  </header>

  <!-- Auto Aspect Ratio TV Screen -->
  <div class="tv-viewport-container" id="tvViewport">
    <div id="transitionToast" class="transition-toast">NEXT EPISODE IN 2S...</div>
    <video
      id="mainPlayer"
      class="tv-video"
      controls
      playsinline
      webkit-playsinline
      preload="auto">
    </video>
    <iframe id="iframePlayer" class="tv-iframe" style="display:none;" allow="autoplay; fullscreen"></iframe>
  </div>

  <!-- Bottom Metadata & Navigation Controls -->
  <div class="tv-meta-deck">
    <div class="broadcast-info">
      <div id="broadcastTitle" class="broadcast-title">Connecting Stream...</div>
      <div id="broadcastContributor" class="broadcast-contributor">Broadcasting Live</div>
    </div>
    <div class="deck-controls">
      <button class="ctrl-btn" onclick="channelDown()" title="Previous Episode">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        <span>PREV</span>
      </button>
      <button class="ctrl-btn" onclick="toggleFullscreen()" title="Fullscreen / Landscape">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>

  <script>
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyI6s-P5dkMz0iJU8qBf4MEEX_eF1JEOfE44XcmaXzC_IYhVjDjPhxJ6E1ujy6jzxlukg/exec";
    const POLL_INTERVAL = 15000;
    const VIDEO_GAP_DELAY_MS = 2000; // Strict 2-second handover

    let currentQueue = [];
    let currentTrackIndex = 0;
    let cachedManifestEtag = null;
    let pollTimerId = null;
    let delayTimerId = null;
    let tvStarted = false;

    let viewerSessionId = localStorage.getItem("PULSE_TV_VIEWER_ID");
    if (!viewerSessionId) {
      viewerSessionId = "view_" + Math.random().toString(36).substring(2, 12);
      localStorage.setItem("PULSE_TV_VIEWER_ID", viewerSessionId);
    }

    const mainPlayer = document.getElementById("mainPlayer");
    const iframePlayer = document.getElementById("iframePlayer");
    const startGate = document.getElementById("startGate");
    const titleElem = document.getElementById("broadcastTitle");
    const contributorElem = document.getElementById("broadcastContributor");
    const transitionToast = document.getElementById("transitionToast");

    window.addEventListener("DOMContentLoaded", () => {
      initPlayerEvents();
      fetchLiveManifest();
      pollTimerId = setInterval(fetchLiveManifest, POLL_INTERVAL);
    });

    function startPulseTV() {
      tvStarted = true;
      startGate.style.display = "none";

      if (currentQueue.length > 0) {
        playVideo(currentQueue[currentTrackIndex]);
      }
    }

    function initPlayerEvents() {
      mainPlayer.addEventListener("ended", () => {
        scheduleNextVideo();
      });

      mainPlayer.addEventListener("error", (e) => {
        console.warn("Direct HTML5 stream rejected by Drive. Engaging preview fallback...", e);
        fallbackToEmbedPlayer(currentQueue[currentTrackIndex]);
      });

      mainPlayer.addEventListener("playing", () => {
        document.getElementById("headerStatus").textContent = "LIVE ON AIR";
      });

      mainPlayer.addEventListener("waiting", () => {
        document.getElementById("headerStatus").textContent = "BUFFERING...";
      });
    }

    function fallbackToEmbedPlayer(track) {
      if (!track || !track.fileId) return;
      mainPlayer.style.display = "none";
      iframePlayer.style.display = "block";
      iframePlayer.src = `https://drive.google.com/file/d/${encodeURIComponent(track.fileId)}/preview`;
    }

    function scheduleNextVideo() {
      if (delayTimerId) clearTimeout(delayTimerId);
      transitionToast.style.display = "block";

      delayTimerId = setTimeout(() => {
        transitionToast.style.display = "none";
        channelUp();
      }, VIDEO_GAP_DELAY_MS);
    }

    async function fetchLiveManifest() {
      try {
        let endpoint = `${GAS_ENDPOINT_URL}?action=getLiveManifest&viewerId=${encodeURIComponent(viewerSessionId)}`;
        if (cachedManifestEtag) endpoint += `&etag=${encodeURIComponent(cachedManifestEtag)}`;

        const res = await fetch(endpoint, { method: "GET", mode: "cors" });
        const json = await res.json();

        if (json.success && json.data) {
          if (json.data.activeViewers !== undefined) {
            document.getElementById("viewerReadout").textContent = `VIEWERS: ${json.data.activeViewers} LIVE`;
          }

          if (json.data.notModified) return;
          if (json.data.etag) cachedManifestEtag = json.data.etag;

          if (json.data.manifest && json.data.manifest.length > 0) {
            const isFirstLoad = currentQueue.length === 0;
            currentQueue = json.data.manifest;

            if (isFirstLoad && tvStarted) {
              currentTrackIndex = 0;
              playVideo(currentQueue[0]);
            }
          }
        }
      } catch (err) {
        console.warn("Manifest update error:", err);
      }
    }

    function playVideo(track) {
      if (!track) return;
      if (delayTimerId) clearTimeout(delayTimerId);
      transitionToast.style.display = "none";

      titleElem.textContent = track.title || track.fileName || "Live Transmission Episode";
      contributorElem.textContent = `@${track.uploaderUsername || "channel"} (${track.uploaderName || "Creator"})`;

      // Reset players to native HTML5 mode
      iframePlayer.style.display = "none";
      iframePlayer.src = "";
      mainPlayer.style.display = "block";

      mainPlayer.pause();
      mainPlayer.src = `https://drive.google.com/uc?export=download&id=${encodeURIComponent(track.fileId)}`;
      mainPlayer.load();

      const playPromise = mainPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          console.warn("Direct stream failed, using embed fallback:", err);
          fallbackToEmbedPlayer(track);
        });
      }
    }

    function channelUp() {
      if (currentQueue.length === 0) return;
      currentTrackIndex = (currentTrackIndex + 1) % currentQueue.length;
      playVideo(currentQueue[currentTrackIndex]);
    }

    function channelDown() {
      if (currentQueue.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + currentQueue.length) % currentQueue.length;
      playVideo(currentQueue[currentTrackIndex]);
    }

    async function toggleFullscreen() {
      const container = document.getElementById("tvViewport");
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) {
          await container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          await container.webkitRequestFullscreen();
        }
        if (screen.orientation && screen.orientation.lock) {
          try { await screen.orientation.lock("landscape"); } catch (e) {}
        }
      } else {
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          await document.webkitExitFullscreen();
        }
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    }
  </script>
</body>
</html>
