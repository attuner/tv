<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PULSE TV // LIVE STREAM</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090A0F">

  <style>
    :root {
      --bg-primary: #090A0F;
      --bg-card: rgba(22, 27, 34, 0.85);
      --border-line: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00F0FF;
      --accent-violet: #7928CA;
      --accent-crimson: #FF3B30;
      --text-main: #F0F6FC;
      --text-muted: #8B949E;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-primary);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(121, 40, 202, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(0, 240, 255, 0.1) 0%, transparent 45%);
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 59, 48, 0.15);
      border: 1px solid var(--accent-crimson);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-crimson);
      letter-spacing: 1px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-crimson);
      box-shadow: 0 0 8px var(--accent-crimson);
      animation: livePulse 1.5s infinite;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .listeners-count {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent-cyan);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* 4:3 Ratio Bezel Frame */
    .tv-deck-container {
      position: relative;
      width: 100%;
      max-width: 560px;
      aspect-ratio: 4 / 3;
      margin: 12px 0 20px 0;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid var(--border-line);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85), 0 0 0 4px rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Auto-zoomed Video to fill 4:3 ratio completely */
    .tv-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      transform: scale(1.02); /* Crop any sub-pixel border gaps */
    }

    .meta-panel {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .track-title {
      font-size: clamp(1.15rem, 3.5vw, 1.45rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .track-contributor {
      font-size: 0.9rem;
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      margin-bottom: 4px;
    }

    .track-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .live-progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .live-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan));
      transition: width 0.5s linear;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 4vw, 24px);
      margin-bottom: 28px;
    }

    .ctrl-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      color: var(--text-main);
      width: 56px;
      height: 56px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-btn:hover {
      border-color: var(--accent-cyan);
      transform: scale(1.05);
    }

    .ctrl-btn.btn-play {
      width: 76px;
      height: 76px;
      background: var(--accent-cyan);
      color: #000;
      border: none;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }

    .ctrl-btn svg { width: 24px; height: 24px; fill: currentColor; }
    .btn-play svg { width: 32px; height: 32px; }

    .queue-panel {
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-line);
      border-radius: 16px;
      padding: clamp(16px, 3vw, 24px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-line);
    }

    .queue-header h4 {
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .queue-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
    }

    .queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-line);
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .queue-left { display: flex; align-items: center; gap: 12px; }
    .queue-tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); font-weight: 700; background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="live-badge">
        <span class="live-dot"></span>
        <span id="liveStatusText">LIVE ON AIR</span>
      </div>
      <div class="listeners-count" id="listenerReadout">VIEWERS: 1 LIVE</div>
    </header>

    <!-- 4:3 Video Monitor Frame -->
    <div class="tv-deck-container">
      <iframe
        id="tvFrame"
        class="tv-frame"
        src=""
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>

    <!-- Metadata Readout -->
    <div class="meta-panel">
      <div id="currentTitle" class="track-title">Connecting to Broadcast Feed...</div>
      <div id="currentContributor" class="track-contributor">Broadcasting Live</div>
      <div id="currentTimestamp" class="track-time">00:00 / 00:00</div>
    </div>

    <!-- Estimated Progress Bar -->
    <div class="live-progress-container">
      <div id="streamProgressBar" class="live-progress-bar"></div>
    </div>

    <!-- Control Buttons -->
    <div class="controls">
      <button class="ctrl-btn" onclick="skipToPreviousTrack()" title="Previous Video">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button id="masterPlayBtn" class="ctrl-btn btn-play" onclick="togglePlayback()" title="Play / Pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <button class="ctrl-btn" onclick="skipToNextTrack()" title="Next Video">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <!-- Recently Aired Shows -->
    <div class="queue-panel">
      <div class="queue-header">
        <h4>Recently Aired (Last 3 Shows)</h4>
        <span id="historyCount" style="font-family:var(--font-mono);font-size:0.8rem;color:var(--text-muted);">0 Records</span>
      </div>
      <ul id="recentlyPlayedList" class="queue-list"></ul>
    </div>
  </div>

  <script>
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyI6s-P5dkMz0iJU8qBf4MEEX_eF1JEOfE44XcmaXzC_IYhVjDjPhxJ6E1ujy6jzxlukg/exec";
    const POLL_INTERVAL = 15000;
    const VIDEO_GAP_DELAY_MS = 2000; // Exact 2-second handover

    let isPlaying = false;
    let currentTrackIndex = 0;
    let currentQueue = [];
    let priorityQueue = [];
    let recentlyPlayedHistory = [];
    let pollTimerId = null;
    let videoTimerId = null;
    let cachedManifestEtag = null;

    let videoDurationSeconds = 0;
    let videoElapsedSeconds = 0;

    let viewerSessionId = localStorage.getItem("PULSE_TV_VIEWER_ID");
    if (!viewerSessionId) {
      viewerSessionId = "view_" + Math.random().toString(36).substring(2, 12);
      localStorage.setItem("PULSE_TV_VIEWER_ID", viewerSessionId);
    }

    const frameElement = document.getElementById("tvFrame");

    window.addEventListener("DOMContentLoaded", () => {
      fetchLiveManifest();
      pollTimerId = setInterval(fetchLiveManifest, POLL_INTERVAL);
    });

    async function fetchLiveManifest() {
      try {
        let endpoint = `${GAS_ENDPOINT_URL}?action=getLiveManifest&viewerId=${encodeURIComponent(viewerSessionId)}`;
        if (cachedManifestEtag) endpoint += `&etag=${encodeURIComponent(cachedManifestEtag)}`;

        const res = await fetch(endpoint, { method: "GET", mode: "cors" });
        const json = await res.json();

        if (json.success && json.data) {
          if (json.data.activeViewers !== undefined) {
            document.getElementById("listenerReadout").textContent = `VIEWERS: ${json.data.activeViewers} LIVE`;
          }

          if (json.data.notModified) return;
          if (json.data.etag) cachedManifestEtag = json.data.etag;

          if (json.data.manifest && json.data.manifest.length > 0) {
            reconcileIncomingManifest(json.data.manifest);
          }
        }
      } catch (err) {
        console.warn("Manifest background polling notice:", err);
      }
    }

    function reconcileIncomingManifest(incomingTracks) {
      if (currentQueue.length === 0) {
        currentQueue = incomingTracks;
        currentTrackIndex = 0;
        loadAndPlayTrack(currentQueue[0]);
        return;
      }

      // Check for videos uploaded mid-stream
      const existingIds = new Set(currentQueue.map(t => t.contentId));
      const newlyAddedTracks = incomingTracks.filter(t => !existingIds.has(t.contentId));

      if (newlyAddedTracks.length > 0) {
        newlyAddedTracks.forEach(newTrack => priorityQueue.push(newTrack));
      }

      const activeContentId = currentQueue[currentTrackIndex]?.contentId;
      currentQueue = incomingTracks;

      const newIndex = currentQueue.findIndex(t => t.contentId === activeContentId);
      if (newIndex !== -1) {
        currentTrackIndex = newIndex;
      }
    }

    function loadAndPlayTrack(track) {
      if (!track) return;
      if (videoTimerId) clearInterval(videoTimerId);

      document.getElementById("currentTitle").textContent = track.title || track.fileName;
      document.getElementById("currentContributor").textContent = `LIVE AIR // @${track.uploaderUsername} (${track.uploaderName})`;

      // Embed player URL that works with Google Drive
      frameElement.src = `https://drive.google.com/file/d/${encodeURIComponent(track.fileId)}/preview`;

      isPlaying = true;
      updatePlayStateUI();

      // Duration tracking & automated 2s chain transition
      videoDurationSeconds = parseInt(track.durationSeconds, 10) || 60;
      videoElapsedSeconds = 0;

      videoTimerId = setInterval(() => {
        if (!isPlaying) return;
        videoElapsedSeconds++;

        const progress = Math.min(100, (videoElapsedSeconds / videoDurationSeconds) * 100);
        document.getElementById("streamProgressBar").style.width = progress + "%";
        document.getElementById("currentTimestamp").textContent =
          `${formatTime(videoElapsedSeconds)} / ${formatTime(videoDurationSeconds)}`;

        if (videoElapsedSeconds >= videoDurationSeconds) {
          clearInterval(videoTimerId);
          handleTrackEnded();
        }
      }, 1000);
    }

    function handleTrackEnded() {
      const finishedTrack = currentQueue[currentTrackIndex];
      if (finishedTrack) recordTrackToRecentlyPlayed(finishedTrack);

      setTimeout(() => {
        if (priorityQueue.length > 0) {
          const nextUrgent = priorityQueue.shift();
          const foundIdx = currentQueue.findIndex(t => t.contentId === nextUrgent.contentId);
          if (foundIdx !== -1) currentTrackIndex = foundIdx;
          loadAndPlayTrack(nextUrgent);
        } else {
          skipToNextTrack();
        }
      }, VIDEO_GAP_DELAY_MS);
    }

    function skipToNextTrack() {
      if (currentQueue.length === 0) return;
      currentTrackIndex++;
      if (currentTrackIndex >= currentQueue.length) currentTrackIndex = 0;
      loadAndPlayTrack(currentQueue[currentTrackIndex]);
    }

    function skipToPreviousTrack() {
      if (currentQueue.length === 0) return;
      currentTrackIndex--;
      if (currentTrackIndex < 0) currentTrackIndex = currentQueue.length - 1;
      loadAndPlayTrack(currentQueue[currentTrackIndex]);
    }

    function recordTrackToRecentlyPlayed(track) {
      recentlyPlayedHistory.unshift({
        title: track.title || track.fileName,
        uploaderUsername: track.uploaderUsername,
        durationSeconds: track.durationSeconds || 0,
        completedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      if (recentlyPlayedHistory.length > 3) recentlyPlayedHistory.pop();
      renderRecentlyPlayedList();
    }

    function renderRecentlyPlayedList() {
      const list = document.getElementById("recentlyPlayedList");
      list.innerHTML = "";
      document.getElementById("historyCount").textContent = `${recentlyPlayedHistory.length} / 3 Logged`;

      if (recentlyPlayedHistory.length === 0) {
        list.innerHTML = `<li style="font-size:0.8rem;color:var(--text-muted);padding:8px 0;">No completed broadcasts yet.</li>`;
        return;
      }

      recentlyPlayedHistory.forEach((item) => {
        const li = document.createElement("li");
        li.className = "queue-item";
        li.innerHTML = `
          <div class="queue-left">
            <span class="queue-tag">AIRED</span>
            <div>
              <div style="font-weight:700;">${item.title}</div>
              <div style="font-size:0.75rem;color:var(--text-muted);">@${item.uploaderUsername} • ${item.completedAt}</div>
            </div>
          </div>
          <div style="font-family:var(--font-mono);font-size:0.75rem;color:var(--text-muted);">${formatTime(item.durationSeconds)}</div>
        `;
        list.appendChild(li);
      });
    }

    function togglePlayback() {
      isPlaying = !isPlaying;
      updatePlayStateUI();
    }

    function updatePlayStateUI() {
      const playIcon = document.getElementById("playIcon");
      const liveDot = document.getElementById("liveDot");
      const liveStatusText = document.getElementById("liveStatusText");

      if (isPlaying) {
        liveDot.classList.add("active");
        liveStatusText.textContent = "LIVE ON AIR";
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        liveDot.classList.remove("active");
        liveStatusText.textContent = "PAUSED";
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function formatTime(seconds) {
      const s = parseInt(seconds, 10) || 0;
      const mins = Math.floor(s / 60);
      const secs = s % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
  </script>
</body>
</html>
