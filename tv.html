<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PULSE TV // LIVE STREAM</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #FFFFFF;
    }

    /* Initial One-Click Gesture Gate to unlock Audio/Video Autoplay */
    .start-gate {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .start-btn {
      background: linear-gradient(135deg, #FF3366, #FF6600);
      color: #FFFFFF;
      border: none;
      padding: 20px 48px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255, 51, 102, 0.55);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-transform: uppercase;
    }

    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 45px rgba(255, 51, 102, 0.85);
    }

    .start-btn:active {
      transform: scale(0.96);
    }

    /* Television Screen Container (Auto Aspect Ratio) */
    .tv-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 110px);
      height: calc(100dvh - 110px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overflow: hidden;
    }

    .tv-video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      background: #000000;
    }

    .tv-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
    }

    /* Broadcast Info Bar & Previous Button */
    .tv-meta-bar {
      width: 100vw;
      min-height: 110px;
      background: #0d1117;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      gap: 16px;
    }

    .broadcast-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 70%;
    }

    .broadcast-title {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 800;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.5px;
    }

    .broadcast-contributor {
      font-size: 0.85rem;
      color: #FF3366;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .prev-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
      padding: 12px 26px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .prev-btn:hover {
      background: #FF3366;
      border-color: #FF3366;
      box-shadow: 0 0 16px rgba(255, 51, 102, 0.4);
    }

    .prev-btn:active {
      transform: scale(0.95);
    }

    .prev-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Start Gate for Browser Permissions -->
  <div id="startGate" class="start-gate">
    <button class="start-btn" onclick="startPulseTV()">📺 START TV</button>
  </div>

  <!-- TV Viewport -->
  <div class="tv-container" id="playerContainer">
    <video
      id="mainPlayer"
      class="tv-video"
      controls
      playsinline
      webkit-playsinline
      preload="auto">
    </video>
    <iframe id="iframePlayer" class="tv-iframe" style="display:none;" allow="autoplay; fullscreen"></iframe>
  </div>

  <!-- Bottom Information Bar: Title, Contributor Name & Previous Channel Button -->
  <div class="tv-meta-bar">
    <div class="broadcast-info">
      <div id="broadcastTitle" class="broadcast-title">Connecting to Television Buffer...</div>
      <div id="broadcastContributor" class="broadcast-contributor">Broadcasting Live</div>
    </div>
    <button class="prev-btn" onclick="channelDown()" title="Previous Episode">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      <span>PREVIOUS</span>
    </button>
  </div>

  <script>
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyI6s-P5dkMz0iJU8qBf4MEEX_eF1JEOfE44XcmaXzC_IYhVjDjPhxJ6E1ujy6jzxlukg/exec";
    const POLL_INTERVAL = 15000;
    const VIDEO_GAP_DELAY_MS = 2000; // Exact 2-second delay between videos

    let currentQueue = [];
    let currentTrackIndex = 0;
    let cachedManifestEtag = null;
    let pollTimerId = null;
    let delayTimerId = null;
    let tvStarted = false;

    const mainPlayer = document.getElementById("mainPlayer");
    const iframePlayer = document.getElementById("iframePlayer");
    const startGate = document.getElementById("startGate");
    const titleElem = document.getElementById("broadcastTitle");
    const contributorElem = document.getElementById("broadcastContributor");

    window.addEventListener("DOMContentLoaded", () => {
      initPlayerEvents();
      fetchLiveManifest();
      pollTimerId = setInterval(fetchLiveManifest, POLL_INTERVAL);
    });

    function startPulseTV() {
      tvStarted = true;
      startGate.style.display = "none";

      if (currentQueue.length > 0) {
        playVideo(currentQueue[currentTrackIndex]);
      }
    }

    function initPlayerEvents() {
      mainPlayer.addEventListener("ended", () => {
        scheduleNextVideo();
      });

      mainPlayer.addEventListener("error", (e) => {
        console.warn("Direct HTML5 stream blocked by Drive. Falling back to native Drive player...", e);
        // If the browser rejects direct stream headers, automatically fall back to Google's embed player
        fallbackToEmbedPlayer(currentQueue[currentTrackIndex]);
      });
    }

    function fallbackToEmbedPlayer(track) {
      if (!track || !track.fileId) return;
      mainPlayer.style.display = "none";
      iframePlayer.style.display = "block";
      iframePlayer.src = `https://drive.google.com/file/d/${encodeURIComponent(track.fileId)}/preview`;
    }

    function scheduleNextVideo() {
      if (delayTimerId) clearTimeout(delayTimerId);
      delayTimerId = setTimeout(() => {
        channelUp();
      }, VIDEO_GAP_DELAY_MS);
    }

    async function fetchLiveManifest() {
      try {
        let endpoint = `${GAS_ENDPOINT_URL}?action=getLiveManifest`;
        if (cachedManifestEtag) endpoint += `&etag=${encodeURIComponent(cachedManifestEtag)}`;

        const res = await fetch(endpoint, { method: "GET", mode: "cors" });
        const json = await res.json();

        if (json.success && json.data) {
          if (json.data.notModified) return;
          if (json.data.etag) cachedManifestEtag = json.data.etag;

          if (json.data.manifest && json.data.manifest.length > 0) {
            const isFirstLoad = currentQueue.length === 0;
            currentQueue = json.data.manifest;

            if (isFirstLoad && tvStarted) {
              currentTrackIndex = 0;
              playVideo(currentQueue[0]);
            }
          }
        }
      } catch (err) {
        console.warn("Manifest update error:", err);
      }
    }

    function playVideo(track) {
      if (!track) return;
      if (delayTimerId) clearTimeout(delayTimerId);

      // Display Broadcast Title & Contributor Name
      titleElem.textContent = track.title || track.fileName || "Live Transmission Episode";
      contributorElem.textContent = `BROADCAST BY @${track.uploaderUsername || "channel"} (${track.uploaderName || "Verified Creator"})`;

      // Reset players to native HTML5 mode
      iframePlayer.style.display = "none";
      iframePlayer.src = "";
      mainPlayer.style.display = "block";

      mainPlayer.pause();
      // Use direct streaming format
      mainPlayer.src = `https://drive.google.com/uc?export=download&id=${encodeURIComponent(track.fileId)}`;
      mainPlayer.load();

      const playPromise = mainPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          console.warn("Direct play rejected by browser policy, engaging preview fallback:", err);
          fallbackToEmbedPlayer(track);
        });
      }
    }

    function channelUp() {
      if (currentQueue.length === 0) return;
      currentTrackIndex = (currentTrackIndex + 1) % currentQueue.length;
      playVideo(currentQueue[currentTrackIndex]);
    }

    function channelDown() {
      if (currentQueue.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + currentQueue.length) % currentQueue.length;
      playVideo(currentQueue[currentTrackIndex]);
    }
  </script>
</body>
</html>
