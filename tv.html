<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PULSE TV // LIVE STREAM</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Seamless Dual Players: Auto-Aspect Ratio Matching Uploaded Video */
    .tv-viewport-video {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      margin: auto;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      aspect-ratio: auto;
      object-fit: contain;
      background: #000000;
      transition: opacity 0.15s ease-in-out;
    }

    .active-video {
      opacity: 1;
      z-index: 2;
      pointer-events: auto;
    }

    .buffer-video {
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Minimal Floating Status HUD */
    .tv-status-overlay {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .status-badge-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 22, 31, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: #F0F6FC;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FF3366;
      box-shadow: 0 0 8px #FF3366;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .track-meta-chip {
      background: rgba(18, 22, 31, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 8px;
      max-width: 320px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .meta-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-time {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.7rem;
      color: #00F0FF;
      margin-top: 2px;
    }

    /* Minimal Bottom Thin Progress Bar */
    .tv-timeline-progress {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 10;
      pointer-events: none;
    }

    .timeline-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FF3366, #00F0FF);
      transition: width 0.15s linear;
    }

    /* Unmute Banner for Autoplay Restrictions */
    .unmute-badge {
      position: fixed;
      bottom: 20px;
      background: rgba(255, 51, 102, 0.95);
      color: #FFFFFF;
      padding: 8px 18px;
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      z-index: 20;
      display: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <!-- Minimal Floating Live Status HUD -->
  <div class="tv-status-overlay" id="statusHud">
    <div class="status-badge-row">
      <span class="live-dot"></span>
      <span id="hudState">LIVE TV</span>
    </div>
    <div class="track-meta-chip">
      <div class="meta-title" id="hudTitle">Connecting Stream...</div>
      <div class="meta-time" id="hudTimecode">00:00 / 00:00</div>
    </div>
  </div>

  <div id="unmuteBadge" class="unmute-badge">🔊 TAP SCREEN TO UNMUTE AUDIO</div>

  <!-- Bottom Slim Progress Line -->
  <div class="tv-timeline-progress">
    <div id="progressFill" class="timeline-bar-fill"></div>
  </div>

  <!-- Dual Independent Players for 0ms Pre-buffering -->
  <video id="playerA" class="tv-viewport-video active-video" autoplay playsinline webkit-playsinline></video>
  <video id="playerB" class="tv-viewport-video buffer-video" playsinline webkit-playsinline></video>

  <script>
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyI6s-P5dkMz0iJU8qBf4MEEX_eF1JEOfE44XcmaXzC_IYhVjDjPhxJ6E1ujy6jzxlukg/exec";
    const POLL_INTERVAL = 15000;

    let currentQueue = [];
    let currentTrackIndex = 0;
    let preloadedNextTrackIndex = -1;
    let cachedManifestEtag = null;
    let pollTimerId = null;

    let activePlayer = document.getElementById("playerA");
    let bufferPlayer = document.getElementById("playerB");

    window.addEventListener("DOMContentLoaded", () => {
      initPlayer(document.getElementById("playerA"));
      initPlayer(document.getElementById("playerB"));

      // Tap screen to toggle audio unmute or fullscreen
      document.body.addEventListener("pointerdown", handleInteraction);

      // Start fetching and playing immediately
      fetchLiveManifest(true);
      pollTimerId = setInterval(fetchLiveManifest, POLL_INTERVAL);
    });

    function handleInteraction() {
      if (activePlayer.muted) {
        activePlayer.muted = false;
        bufferPlayer.muted = false;
        document.getElementById("unmuteBadge").style.display = "none";
      }
    }

    function initPlayer(player) {
      player.addEventListener("timeupdate", () => {
        if (player !== activePlayer || !player.duration || !isFinite(player.duration)) return;

        const progress = (player.currentTime / player.duration) * 100;
        document.getElementById("progressFill").style.width = progress + "%";

        const cur = formatTime(player.currentTime);
        const dur = formatTime(player.duration);
        document.getElementById("hudTimecode").textContent = `${cur} / ${dur}`;

        // 10-Second Pre-buffer: buffer next video before completion
        const timeLeft = player.duration - player.currentTime;
        if (timeLeft <= 10 && timeLeft > 0.5) {
          triggerNextVideoPrebuffer();
        }
      });

      // 0ms Handover upon completion
      player.addEventListener("ended", () => {
        if (player === activePlayer) {
          handleSeamlessVideoEnd();
        }
      });

      player.addEventListener("error", () => {
        if (player === activePlayer) {
          handleSeamlessVideoEnd();
        }
      });

      player.addEventListener("waiting", () => {
        if (player === activePlayer) {
          document.getElementById("hudState").textContent = "BUFFERING...";
        }
      });

      player.addEventListener("playing", () => {
        if (player === activePlayer) {
          document.getElementById("hudState").textContent = "LIVE TV";
        }
      });
    }

    async function fetchLiveManifest(isInitial = false) {
      try {
        let endpoint = `${GAS_ENDPOINT_URL}?action=getLiveManifest`;
        if (cachedManifestEtag) endpoint += `&etag=${encodeURIComponent(cachedManifestEtag)}`;

        const res = await fetch(endpoint, { method: "GET", mode: "cors" });
        const json = await res.json();

        if (json.success && json.data) {
          if (json.data.notModified) return;
          if (json.data.etag) cachedManifestEtag = json.data.etag;

          if (json.data.manifest && json.data.manifest.length > 0) {
            const isFirstLoad = currentQueue.length === 0;
            currentQueue = json.data.manifest;

            if (isFirstLoad) {
              currentTrackIndex = 0;
              playCurrentVideoDirect();
            }
          }
        }
      } catch (err) {
        console.warn("Manifest update note:", err);
      }
    }

    function playCurrentVideoDirect() {
      if (currentQueue.length === 0) return;
      const track = currentQueue[currentTrackIndex];
      preloadedNextTrackIndex = -1;

      document.getElementById("hudTitle").textContent = track.title || track.fileName;

      activePlayer.src = track.streamUrl;
      const promise = activePlayer.play();

      if (promise !== undefined) {
        promise.catch(() => {
          // Autoplay protection fallback
          activePlayer.muted = true;
          activePlayer.play().then(() => {
            document.getElementById("unmuteBadge").style.display = "block";
          }).catch(() => {
            activePlayer.src = track.downloadUrl;
            activePlayer.play().catch(() => {});
          });
        });
      }
    }

    function triggerNextVideoPrebuffer() {
      if (currentQueue.length <= 1) return;
      const nextIndex = (currentTrackIndex + 1) % currentQueue.length;
      if (preloadedNextTrackIndex === nextIndex) return;

      preloadedNextTrackIndex = nextIndex;
      const nextTrack = currentQueue[nextIndex];
      bufferPlayer.src = nextTrack.streamUrl;
      bufferPlayer.load();
    }

    function handleSeamlessVideoEnd() {
      if (currentQueue.length === 0) return;

      currentTrackIndex = (currentTrackIndex + 1) % currentQueue.length;
      const nextTrack = currentQueue[currentTrackIndex];

      // Instant swap of dual players
      const oldActive = activePlayer;
      activePlayer = bufferPlayer;
      bufferPlayer = oldActive;

      activePlayer.className = "tv-viewport-video active-video";
      bufferPlayer.className = "tv-viewport-video buffer-video";

      document.getElementById("hudTitle").textContent = nextTrack.title || nextTrack.fileName;
      activePlayer.muted = bufferPlayer.muted;

      const promise = activePlayer.play();
      if (promise !== undefined) {
        promise.catch(() => {
          activePlayer.src = nextTrack.streamUrl;
          activePlayer.play().catch(() => {});
        });
      }

      preloadedNextTrackIndex = -1;
    }

    function formatTime(seconds) {
      const s = Math.floor(seconds) || 0;
      const mins = Math.floor(s / 60);
      const secs = s % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
  </script>
</body>
</html>
