<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PULSE TV // LIVE TELEVISION</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Seamless Dual Players: Auto Aspect Ratio Based on Uploaded Video */
    .tv-viewport-video {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      margin: auto;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      aspect-ratio: auto;
      object-fit: contain;
      background: #000000;
      transition: opacity 0.15s ease-in-out;
    }

    .active-video {
      opacity: 1;
      z-index: 2;
      pointer-events: auto;
    }

    .buffer-video {
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Non-intrusive floating indicator for browser autoplay mute policy */
    .unmute-badge {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255, 51, 102, 0.9);
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 10;
      display: none;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div id="unmuteBadge" class="unmute-badge">🔊 TAP ANYWHERE TO UNMUTE AUDIO</div>

  <!-- VIDEO ONLY: DUAL RUNNING PLAYERS -->
  <video id="playerA" class="tv-viewport-video active-video" autoplay playsinline webkit-playsinline></video>
  <video id="playerB" class="tv-viewport-video buffer-video" playsinline webkit-playsinline></video>

  <script>
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyI6s-P5dkMz0iJU8qBf4MEEX_eF1JEOfE44XcmaXzC_IYhVjDjPhxJ6E1ujy6jzxlukg/exec";
    const POLL_INTERVAL = 15000;

    let currentQueue = [];
    let currentTrackIndex = 0;
    let preloadedNextTrackIndex = -1;
    let cachedManifestEtag = null;
    let pollTimerId = null;

    let activePlayer = document.getElementById("playerA");
    let bufferPlayer = document.getElementById("playerB");

    window.addEventListener("DOMContentLoaded", () => {
      initPlayer(document.getElementById("playerA"));
      initPlayer(document.getElementById("playerB"));

      // Any screen touch/click un-mutes and resumes full audio
      document.body.addEventListener("pointerdown", handleGlobalUnmute, { once: true });

      // Immediate play on load
      fetchLiveManifest(true);
      pollTimerId = setInterval(fetchLiveManifest, POLL_INTERVAL);
    });

    function handleGlobalUnmute() {
      activePlayer.muted = false;
      bufferPlayer.muted = false;
      document.getElementById("unmuteBadge").style.display = "none";
    }

    function initPlayer(player) {
      player.addEventListener("timeupdate", () => {
        if (player !== activePlayer || !player.duration || !isFinite(player.duration)) return;

        // Preload next video 10 seconds before completion
        const timeLeft = player.duration - player.currentTime;
        if (timeLeft <= 10 && timeLeft > 0.5) {
          triggerNextVideoPrebuffer();
        }
      });

      // 0ms delay: Instantaneous handover
      player.addEventListener("ended", () => {
        if (player === activePlayer) {
          handleSeamlessVideoEnd();
        }
      });

      player.addEventListener("error", () => {
        if (player === activePlayer) {
          handleSeamlessVideoEnd();
        }
      });
    }

    async function fetchLiveManifest(isInitial = false) {
      try {
        let endpoint = `${GAS_ENDPOINT_URL}?action=getLiveManifest`;
        if (cachedManifestEtag) endpoint += `&etag=${encodeURIComponent(cachedManifestEtag)}`;

        const res = await fetch(endpoint, { method: "GET", mode: "cors" });
        const json = await res.json();

        if (json.success && json.data) {
          if (json.data.notModified) return;
          if (json.data.etag) cachedManifestEtag = json.data.etag;

          if (json.data.manifest && json.data.manifest.length > 0) {
            const isFirstLoad = currentQueue.length === 0;
            currentQueue = json.data.manifest;

            if (isFirstLoad) {
              currentTrackIndex = 0;
              playCurrentVideoDirect();
            }
          }
        }
      } catch (err) {}
    }

    function playCurrentVideoDirect() {
      if (currentQueue.length === 0) return;
      const track = currentQueue[currentTrackIndex];
      preloadedNextTrackIndex = -1;

      activePlayer.src = track.streamUrl;
      const promise = activePlayer.play();

      if (promise !== undefined) {
        promise.catch(() => {
          // Autoplay policy: start muted without stopping
          activePlayer.muted = true;
          activePlayer.play().then(() => {
            document.getElementById("unmuteBadge").style.display = "block";
          }).catch(() => {
            activePlayer.src = track.downloadUrl;
            activePlayer.play().catch(() => {});
          });
        });
      }
    }

    function triggerNextVideoPrebuffer() {
      if (currentQueue.length <= 1) return;
      const nextIndex = (currentTrackIndex + 1) % currentQueue.length;
      if (preloadedNextTrackIndex === nextIndex) return;

      preloadedNextTrackIndex = nextIndex;
      const nextTrack = currentQueue[nextIndex];
      bufferPlayer.src = nextTrack.streamUrl;
      bufferPlayer.load();
    }

    function handleSeamlessVideoEnd() {
      if (currentQueue.length === 0) return;

      currentTrackIndex = (currentTrackIndex + 1) % currentQueue.length;
      const nextTrack = currentQueue[currentTrackIndex];

      // Swap Players (Zero Standby)
      const oldActive = activePlayer;
      activePlayer = bufferPlayer;
      bufferPlayer = oldActive;

      activePlayer.className = "tv-viewport-video active-video";
      bufferPlayer.className = "tv-viewport-video buffer-video";

      activePlayer.muted = bufferPlayer.muted;
      const promise = activePlayer.play();

      if (promise !== undefined) {
        promise.catch(() => {
          activePlayer.src = nextTrack.streamUrl;
          activePlayer.play().catch(() => {});
        });
      }

      preloadedNextTrackIndex = -1;
    }
  </script>
</body>
</html>
