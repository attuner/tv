<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PULSE TV // LIVE STREAM</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Start TV Modal Gate */
    .start-gate {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .start-btn {
      background: linear-gradient(135deg, #FF3366, #FF6600);
      color: #FFFFFF;
      border: none;
      padding: 20px 48px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255, 51, 102, 0.55);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-transform: uppercase;
    }

    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 45px rgba(255, 51, 102, 0.85);
    }

    .start-btn:active {
      transform: scale(0.96);
    }

    /* Video Player Viewport - Dynamic Aspect Ratio */
    .tv-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 65px);
      height: calc(100dvh - 65px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .tv-video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      background: #000000;
    }

    /* Minimal Bottom Control Bar with Only Previous Button */
    .tv-bottom-bar {
      width: 100vw;
      height: 65px;
      background: #0a0c10;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
    }

    .prev-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .prev-btn:hover {
      background: #FF3366;
      border-color: #FF3366;
      box-shadow: 0 0 16px rgba(255, 51, 102, 0.4);
    }

    .prev-btn:active {
      transform: scale(0.95);
    }

    .prev-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Initial User-Gesture Gate -->
  <div id="startGate" class="start-gate">
    <button class="start-btn" onclick="startPulseTV()">📺 START TV</button>
  </div>

  <!-- Pure Video Player Container -->
  <div class="tv-container">
    <video
      id="mainPlayer"
      class="tv-video"
      controls
      playsinline
      webkit-playsinline
      preload="auto">
    </video>
  </div>

  <!-- Bottom Bar: Only Previous Button -->
  <div class="tv-bottom-bar">
    <button class="prev-btn" onclick="channelDown()" title="Previous Episode">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      <span>PREVIOUS</span>
    </button>
  </div>

  <script>
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyI6s-P5dkMz0iJU8qBf4MEEX_eF1JEOfE44XcmaXzC_IYhVjDjPhxJ6E1ujy6jzxlukg/exec";
    const POLL_INTERVAL = 15000;
    const VIDEO_GAP_DELAY_MS = 2000; // Exact 2-second delay between videos

    let currentQueue = [];
    let currentTrackIndex = 0;
    let cachedManifestEtag = null;
    let pollTimerId = null;
    let delayTimerId = null;
    let tvStarted = false;

    const mainPlayer = document.getElementById("mainPlayer");
    const startGate = document.getElementById("startGate");

    window.addEventListener("DOMContentLoaded", () => {
      initPlayerEvents();
      fetchLiveManifest();
      pollTimerId = setInterval(fetchLiveManifest, POLL_INTERVAL);
    });

    // Gesture unlock handler that ensures unmuted auto-progression on all platforms
    function startPulseTV() {
      tvStarted = true;
      startGate.style.display = "none";

      if (currentQueue.length > 0) {
        playVideo(currentQueue[currentTrackIndex]);
      }
    }

    function initPlayerEvents() {
      // Upon finishing, wait exactly 2 seconds and auto-play next video
      mainPlayer.addEventListener("ended", () => {
        scheduleNextVideo();
      });

      // If an individual video errors, also skip to the next after 2 seconds
      mainPlayer.addEventListener("error", () => {
        if (tvStarted) {
          console.warn("Stream error encountered, advancing to next video in 2s...");
          scheduleNextVideo();
        }
      });
    }

    function scheduleNextVideo() {
      if (delayTimerId) clearTimeout(delayTimerId);
      delayTimerId = setTimeout(() => {
        channelUp();
      }, VIDEO_GAP_DELAY_MS);
    }

    async function fetchLiveManifest() {
      try {
        let endpoint = `${GAS_ENDPOINT_URL}?action=getLiveManifest`;
        if (cachedManifestEtag) endpoint += `&etag=${encodeURIComponent(cachedManifestEtag)}`;

        const res = await fetch(endpoint, { method: "GET", mode: "cors" });
        const json = await res.json();

        if (json.success && json.data) {
          if (json.data.notModified) return;
          if (json.data.etag) cachedManifestEtag = json.data.etag;

          if (json.data.manifest && json.data.manifest.length > 0) {
            const isFirstLoad = currentQueue.length === 0;
            currentQueue = json.data.manifest;

            // If user has already clicked START TV and queue was empty, play now
            if (isFirstLoad && tvStarted) {
              currentTrackIndex = 0;
              playVideo(currentQueue[0]);
            }
          }
        }
      } catch (err) {
        console.warn("Manifest update error:", err);
      }
    }

    function playVideo(track) {
      if (!track) return;
      if (delayTimerId) clearTimeout(delayTimerId);

      // Reset previous source
      mainPlayer.pause();
      mainPlayer.src = track.streamUrl;
      mainPlayer.load();

      // Autoplay with audio enabled across all modern engines
      const playPromise = mainPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          console.warn("Direct stream failed, falling back to download link...", err);
          mainPlayer.src = track.downloadUrl;
          mainPlayer.play().catch((fallbackErr) => {
            console.warn("Playback blocked by browser policy:", fallbackErr);
          });
        });
      }
    }

    function channelUp() {
      if (currentQueue.length === 0) return;
      currentTrackIndex = (currentTrackIndex + 1) % currentQueue.length;
      playVideo(currentQueue[currentTrackIndex]);
    }

    function channelDown() {
      if (currentQueue.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + currentQueue.length) % currentQueue.length;
      playVideo(currentQueue[currentTrackIndex]);
    }
  </script>
</body>
</html>
