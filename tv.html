<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PULSE TV // LIVE STREAM</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .video-viewport-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
    }

    /* Auto Aspect Ratio Based on Uploaded Video Resolution */
    .tv-viewport-video {
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      aspect-ratio: auto;
      object-fit: contain;
      background: #000000;
      z-index: 2;
    }

    /* Status HUD */
    .tv-status-overlay {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .status-badge-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: #F0F6FC;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FF3366;
      box-shadow: 0 0 8px #FF3366;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .track-meta-chip {
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 8px;
      max-width: 320px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .meta-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-channel {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.7rem;
      color: #00F0FF;
      margin-top: 2px;
    }

    .unmute-badge {
      position: fixed;
      top: 18px;
      right: 18px;
      background: rgba(255, 51, 102, 0.95);
      color: #FFFFFF;
      padding: 8px 18px;
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      z-index: 20;
      display: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      cursor: pointer;
    }

    /* Embedded iframe fallback when browser blocks range headers */
    .tv-fallback-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 3;
      display: none;
    }
  </style>
</head>
<body>

  <div class="tv-status-overlay" id="statusHud">
    <div class="status-badge-row">
      <span class="live-dot"></span>
      <span id="hudState">LIVE BROADCAST</span>
    </div>
    <div class="track-meta-chip">
      <div class="meta-title" id="hudTitle">Connecting Stream...</div>
      <div class="meta-channel" id="hudChannel">@channel</div>
    </div>
  </div>

  <div id="unmuteBadge" class="unmute-badge" onclick="handleUnmute()">🔊 TAP TO UNMUTE</div>

  <div class="video-viewport-wrapper">
    <!-- Active Native Video Player with Full On-Screen Controls -->
    <video
      id="mainPlayer"
      class="tv-viewport-video"
      autoplay
      controls
      playsinline
      webkit-playsinline
      preload="auto">
    </video>

    <!-- Hidden Preloader for Gapless 10-Second Pre-buffering -->
    <video id="preloader" style="display:none;" preload="auto"></video>

    <!-- Fallback iframe player for strict Drive environments -->
    <iframe id="embedPlayer" class="tv-fallback-iframe" allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyI6s-P5dkMz0iJU8qBf4MEEX_eF1JEOfE44XcmaXzC_IYhVjDjPhxJ6E1ujy6jzxlukg/exec";
    const POLL_INTERVAL = 15000;

    let currentQueue = [];
    let currentTrackIndex = 0;
    let preloadedNextTrackIndex = -1;
    let cachedManifestEtag = null;
    let pollTimerId = null;

    const mainPlayer = document.getElementById("mainPlayer");
    const preloader = document.getElementById("preloader");
    const embedPlayer = document.getElementById("embedPlayer");

    window.addEventListener("DOMContentLoaded", () => {
      initPlayerEvents();
      fetchLiveManifest(true);
      pollTimerId = setInterval(fetchLiveManifest, POLL_INTERVAL);
    });

    function handleUnmute() {
      mainPlayer.muted = false;
      document.getElementById("unmuteBadge").style.display = "none";
    }

    function initPlayerEvents() {
      mainPlayer.addEventListener("timeupdate", () => {
        if (!mainPlayer.duration || !isFinite(mainPlayer.duration)) return;

        // Pre-buffer next video in background 10 seconds before completion
        const timeLeft = mainPlayer.duration - mainPlayer.currentTime;
        if (timeLeft <= 10 && timeLeft > 0.5) {
          triggerNextVideoPrebuffer();
        }
      });

      // Advance to next video immediately upon finish
      mainPlayer.addEventListener("ended", () => {
        handleTrackEnded();
      });

      // Handle stream errors by falling back to Drive embed player or advancing
      mainPlayer.addEventListener("error", () => {
        console.warn("Direct stream error encountered, switching to web preview player...");
        const track = currentQueue[currentTrackIndex];
        if (track && track.embedUrl) {
          mainPlayer.style.display = "none";
          embedPlayer.src = track.embedUrl;
          embedPlayer.style.display = "block";
        } else {
          handleTrackEnded();
        }
      });

      mainPlayer.addEventListener("waiting", () => {
        document.getElementById("hudState").textContent = "BUFFERING...";
      });

      mainPlayer.addEventListener("playing", () => {
        document.getElementById("hudState").textContent = "LIVE BROADCAST";
      });
    }

    async function fetchLiveManifest(isInitial = false) {
      try {
        let endpoint = `${GAS_ENDPOINT_URL}?action=getLiveManifest`;
        if (cachedManifestEtag) endpoint += `&etag=${encodeURIComponent(cachedManifestEtag)}`;

        const res = await fetch(endpoint, { method: "GET", mode: "cors" });
        const json = await res.json();

        if (json.success && json.data) {
          if (json.data.notModified) return;
          if (json.data.etag) cachedManifestEtag = json.data.etag;

          if (json.data.manifest && json.data.manifest.length > 0) {
            const isFirstLoad = currentQueue.length === 0;
            currentQueue = json.data.manifest;

            if (isFirstLoad) {
              currentTrackIndex = 0;
              playCurrentVideo();
            }
          }
        }
      } catch (err) {
        console.warn("Manifest update error:", err);
      }
    }

    function playCurrentVideo() {
      if (currentQueue.length === 0) return;
      const track = currentQueue[currentTrackIndex];
      preloadedNextTrackIndex = -1;

      // Update HUD
      document.getElementById("hudTitle").textContent = track.title || track.fileName;
      document.getElementById("hudChannel").textContent = `@${track.uploaderUsername} (${track.uploaderName})`;

      // Reset embed player
      embedPlayer.style.display = "none";
      embedPlayer.src = "";
      mainPlayer.style.display = "block";

      mainPlayer.src = track.streamUrl;
      const promise = mainPlayer.play();

      if (promise !== undefined) {
        promise.catch(() => {
          // Autoplay policy: start muted and display unmute button
          mainPlayer.muted = true;
          mainPlayer.play().then(() => {
            document.getElementById("unmuteBadge").style.display = "block";
          }).catch(() => {
            // Direct playback blocked, fallback to embedded player
            mainPlayer.style.display = "none";
            embedPlayer.src = track.embedUrl;
            embedPlayer.style.display = "block";
          });
        });
      }
    }

    function triggerNextVideoPrebuffer() {
      if (currentQueue.length <= 1) return;
      const nextIndex = (currentTrackIndex + 1) % currentQueue.length;
      if (preloadedNextTrackIndex === nextIndex) return;

      preloadedNextTrackIndex = nextIndex;
      const nextTrack = currentQueue[nextIndex];
      preloader.src = nextTrack.streamUrl;
      preloader.load();
    }

    function handleTrackEnded() {
      if (currentQueue.length === 0) return;
      currentTrackIndex = (currentTrackIndex + 1) % currentQueue.length;
      playCurrentVideo();
    }
  </script>
</body>
</html>
